name: pipeline
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-evidence.lock
      - run: python -m compileall -q pipeline
      - run: python -m unittest discover -s pipeline/tests -v
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These synthetic controls fit the 2-CPU hosted runner. Production
      # campaigns retain their separately configured resource limits.
      ARENA_HARBOR_CPUS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv-harbor
      - run: .venv-harbor/bin/python -m pip install --require-hashes -r requirements-native.lock -r requirements-evidence.lock
      - run: .venv-harbor/bin/python -m pipeline.tests.native_smoke --out /tmp/arena-native-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-native-controls
          path: /tmp/arena-native-ci
          retention-days: 7
